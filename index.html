<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayStation Universe | Game Library</title>
<style>
:root{color-scheme:dark;--bg:#070d1e;--panel:#111d37;--line:#273653;--text:#f3f6ff;--muted:#a3b2d0;--blue:#368cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#142c60 0,#070d1e 55%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}header{padding:25px clamp(18px,4vw,60px);display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:#071025c9}header .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,#2787ff,#6c55e9);display:grid;place-items:center;font-weight:900;font-size:25px}header h1{margin:0;font-size:clamp(20px,3vw,29px)}header p{margin:3px 0 0;color:var(--muted);font-size:13px}main{max-width:1500px;margin:auto;padding:30px clamp(16px,4vw,55px)}.hero{margin-bottom:22px}.hero h2{font-size:clamp(25px,4vw,40px);margin:0 0 6px}.hero p{color:var(--muted);margin:0}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 14px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:12px;background:#13213c;color:white;padding:13px 15px;font:inherit}.toolbar input{flex:1;min-width:230px}.toolbar select{min-width:190px}.status{color:var(--muted);min-height:24px;margin:12px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:18px}.card{background:linear-gradient(145deg,#152544,#0e182c);border:1px solid var(--line);border-radius:15px;overflow:hidden;min-width:0}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;background:#1b2a45;display:block}.fallback{aspect-ratio:3/4;display:grid;place-items:center;text-align:center;padding:12px;font-weight:700;color:#a7c7ff;background:linear-gradient(145deg,#1c3b70,#141c33)}.details{padding:12px}.name{font-weight:700;line-height:1.35;min-height:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:12px;color:var(--muted);margin-top:7px}.source{display:inline-block;margin-top:10px;color:#8dbdff;text-decoration:none;font-size:12px}.source:hover{text-decoration:underline}.pager{display:flex;justify-content:center;align-items:center;gap:16px;margin:28px 0}.pager button,.retry{border:1px solid #4485dc;background:#204e93;color:white;border-radius:10px;padding:11px 18px;cursor:pointer}.pager button:disabled{opacity:.35;cursor:default}.error{color:#ffc3c3}.small{font-size:12px;color:var(--muted)}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.details{padding:9px}.toolbar select{flex:1}}
</style>
</head>
<body>
<header><div class="logo">P</div><div><h1>PlayStation Universe</h1><p>PS4 Game Library • Browse and search</p></div></header>
<main>
<section class="hero"><h2>Discover your games</h2><p>Browse your GitHub catalogs with covers and search.</p></section>
<div class="toolbar"><input id="search" type="search" placeholder="Search game titles or title IDs…" aria-label="Search games"><select id="filter" aria-label="Catalog filter"><option value="all">All catalogs</option><option value="games">games.json</option><option value="downloads">PS4 games with downloads</option></select></div>
<div id="status" class="status" role="status">Loading catalogs…</div><div id="grid" class="grid"></div><div id="pager" class="pager" hidden><button id="prev">Previous</button><span id="pageInfo"></span><button id="next">Next</button></div>
<p class="small">This website is a game metadata browser. It does not install games or verify third-party download links.</p>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), state={items:[],filtered:[],page:0,loaded:[],errors:[]},PAGE=60;
const clean=v=>typeof v==='string'?v.trim():'';
const normalize=s=>clean(s).toLocaleLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const validHttp=s=>{try{const u=new URL(s);return u.protocol==='https:'||u.protocol==='http:'}catch{return false}};
function readGames(json){const out=[];if(json&&json.DATA&&typeof json.DATA==='object'){for(const [key,val] of Object.entries(json.DATA)){if(!val||typeof val!=='object')continue;const name=clean(val.name)||clean(val.title)||clean(val.title_id);if(!name)continue;out.push({name,id:clean(val.title_id),cover:clean(val.cover_url)||clean(val.cover),version:clean(val.version),source:'games',pageUrl:'',region:clean(val.region)})}}else if(Array.isArray(json)){for(const val of json){if(!val||typeof val!=='object')continue;const name=clean(val.name)||clean(val.title);if(!name)continue;out.push({name,id:clean(val.title_id),cover:clean(val.cover_url)||clean(val.cover),version:clean(val.version),source:'games',pageUrl:clean(val.page_url),region:clean(val.region)})}}return out}
function readDownloads(json){if(!Array.isArray(json))return[];return json.filter(x=>x&&typeof x==='object'&&clean(x.name)).map(x=>({name:clean(x.name),id:clean(x.title_id),cover:clean(x.cover_url),version:clean(x.version),source:'downloads',pageUrl:clean(x.page_url),region:clean(x.region)}))}
async function getJSON(path){const res=await fetch('./'+path,{cache:'no-cache'});if(!res.ok)throw Error(path+': HTTP '+res.status);return res.json()}
function addCard(item){const el=document.createElement('article');el.className='card';const coverWrap=document.createElement('div');if(validHttp(item.cover)){const img=document.createElement('img');img.className='cover';img.loading='lazy';img.alt='Cover for '+item.name;img.referrerPolicy='no-referrer';img.src=item.cover;img.onerror=()=>{img.remove();coverWrap.appendChild(fallback(item.name))};coverWrap.appendChild(img)}else coverWrap.appendChild(fallback(item.name));el.appendChild(coverWrap);const d=document.createElement('div');d.className='details';const title=document.createElement('div');title.className='name';title.textContent=item.name;d.appendChild(title);const meta=document.createElement('div');meta.className='meta';meta.textContent=[item.id,item.version?'v'+item.version:'',item.source==='downloads'?'Downloads listing':'Games catalog'].filter(Boolean).join(' • ');d.appendChild(meta);if(validHttp(item.pageUrl)){const a=document.createElement('a');a.className='source';a.href=item.pageUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='View source page';d.appendChild(a)}el.appendChild(d);return el}
function fallback(name){const div=document.createElement('div');div.className='fallback';div.textContent=name;return div}
function render(){const q=normalize($('search').value),filter=$('filter').value;state.filtered=state.items.filter(x=>(filter==='all'||x.source===filter)&&(!q||normalize(x.name+' '+x.id).includes(q)));const pages=Math.ceil(state.filtered.length/PAGE);state.page=Math.min(state.page,Math.max(0,pages-1));const start=state.page*PAGE;const fragment=document.createDocumentFragment();for(const item of state.filtered.slice(start,start+PAGE))fragment.appendChild(addCard(item));$('grid').replaceChildren(fragment);$('status').textContent=state.filtered.length.toLocaleString()+' games shown from '+state.loaded.join(' + ')+(state.errors.length?' • '+state.errors.join(' • '):'');$('pager').hidden=pages<=1;$('pageInfo').textContent='Page '+(state.page+1)+' of '+Math.max(1,pages);$('prev').disabled=state.page===0;$('next').disabled=state.page>=pages-1}
$('search').addEventListener('input',()=>{state.page=0;render()});$('filter').addEventListener('change',()=>{state.page=0;render()});$('prev').addEventListener('click',()=>{state.page--;render();window.scrollTo({top:0,behavior:'smooth'})});$('next').addEventListener('click',()=>{state.page++;render();window.scrollTo({top:0,behavior:'smooth'})});
async function init(){const results=await Promise.allSettled([getJSON('games.json'),getJSON('ps4_games_with_downloads.json')]);const games=results[0].status==='fulfilled'?readGames(results[0].value):[];const downloads=results[1].status==='fulfilled'?readDownloads(results[1].value):[];if(results[0].status==='fulfilled')state.loaded.push('games.json');else state.errors.push('games.json failed');if(results[1].status==='fulfilled')state.loaded.push('ps4_games_with_downloads.json');else state.errors.push('downloads JSON failed');const byName=new Map();for(const g of downloads){const key=normalize(g.name);if(key)byName.set(key,g)}for(const g of games){const key=normalize(g.name);if(!key)continue;const prior=byName.get(key);if(prior){byName.set(key,{...prior,...g,cover:g.cover||prior.cover,pageUrl:prior.pageUrl||g.pageUrl,source:'games'})}else byName.set(key,g)}state.items=Array.from(byName.values()).sort((a,b)=>a.name.localeCompare(b.name));render();if(!state.items.length){$('status').className='status error';$('status').textContent='No games loaded. Check that both JSON files exist in the same GitHub Pages folder and contain valid JSON.'}}
init().catch(e=>{$('status').className='status error';$('status').textContent='Could not load catalogs: '+e.message});
})();
</script>
</body>
</html>
