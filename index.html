<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayStation Universe</title><style>*{box-sizing:border-box}body{margin:0;background:#071329;color:#fff;font:16px Arial,sans-serif}header{background:linear-gradient(110deg,#143a91,#071329);padding:26px 5%}h1{margin:0;font-size:30px}small,.muted{color:#b9c9e8}main{padding:18px 5%}input,select{padding:13px;border-radius:8px;border:1px solid #4163a5;background:#14264b;color:white;font-size:16px;max-width:100%}input{width:100%;margin-bottom:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{padding:10px;border:1px solid #35558e;border-radius:8px;background:#132b56;color:#fff;cursor:pointer}.tabs button.active{background:#2c66d6}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}.card{background:#132443;border-radius:12px;overflow:hidden;padding-bottom:12px}.cover{height:210px;background:#263b61;display:flex;align-items:center;justify-content:center}.cover img{height:100%;width:100%;object-fit:cover}.info{padding:12px}.name{font-weight:bold;min-height:42px}.tag{font-size:12px;color:#a8bce2;margin:8px 0}a.pkg{display:inline-block;color:white;background:#2466db;border-radius:7px;padding:9px;text-decoration:none}span.unavailable{font-size:12px;color:#a7b6d1}.pager{display:flex;gap:15px;align-items:center;justify-content:center;margin:25px}.pager button{padding:10px 20px;background:#2354ae;color:#fff;border:0;border-radius:7px}</style></head><body><header><h1>PlayStation Universe</h1><p>Browse the PS4 catalog and discover authorized homebrew packages.</p><small id="status">Loading catalog…</small></header><main><input id="search" placeholder="Search games…" aria-label="Search games"><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div><div class="pager"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div><p class="muted">Game listings are informational. A download link appears only when an authorized package URL has been supplied. Package compatibility and availability are not guaranteed.</p></main><script>
var games=[],pkg={},section='All',query='',page=0,pageSize=48,filtered=[];
function load(url,callback){var x=new XMLHttpRequest();x.open('GET',url,true);x.onreadystatechange=function(){if(x.readyState===4)callback(x.status===200?JSON.parse(x.responseText):null)};x.send()}
function txt(el,value){el.textContent=value||''}
function render(){filtered=games.filter(function(g){return(section==='All'||g.catalog_section===section)&&(!query||String(g.title).toLowerCase().indexOf(query)>=0)});var count=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,count-1);var grid=document.getElementById('grid');grid.innerHTML='';filtered.slice(page*pageSize,(page+1)*pageSize).forEach(function(g){var card=document.createElement('article');card.className='card';var cover=document.createElement('div');cover.className='cover';if(g.cover&&/^https:\/\//.test(g.cover)){var img=document.createElement('img');img.loading='lazy';img.alt='';img.src=g.cover;cover.appendChild(img)}else{txt(cover,'No cover')}card.appendChild(cover);var info=document.createElement('div');info.className='info';var name=document.createElement('div');name.className='name';txt(name,g.title);info.appendChild(name);var tag=document.createElement('div');tag.className='tag';txt(tag,g.catalog_section);info.appendChild(tag);var found=null;Object.keys(pkg).some(function(url){if(pkg[url].name&&pkg[url].name.toLowerCase()===String(g.title).toLowerCase()){found=url;return true}return false});if(found){var a=document.createElement('a');a.className='pkg';a.href=found;a.textContent='Authorized PKG link';a.rel='noopener noreferrer';info.appendChild(a)}else{var span=document.createElement('span');span.className='unavailable';span.textContent='Package not available';info.appendChild(span)}card.appendChild(info);grid.appendChild(card)});txt(document.getElementById('page'),(page+1)+' / '+count+' · '+filtered.length+' listings')}
load('catalog.json',function(d){if(!d||!Array.isArray(d.games)){txt(document.getElementById('status'),'Catalog could not load. Host these files on GitHub Pages; do not open index.html as a local file.');return}games=d.games;txt(document.getElementById('status'),games.length.toLocaleString()+' game listings');var tabs=document.getElementById('tabs');['All'].concat(d.categories&&Array.isArray(d.categories)?d.categories.map(function(c){return typeof c==='string'?c:c.name}):['PS4 Games','Arabic PS4 Games','PS1 to PS4','PS2 to PS4']).forEach(function(s){if(!s)return;var b=document.createElement('button');b.textContent=s;b.onclick=function(){section=s;page=0;Array.prototype.forEach.call(tabs.children,function(x){x.className=x===b?'active':''});render()};if(s==='All')b.className='active';tabs.appendChild(b)});load('installer_games.json',function(p){pkg=p&&p.DATA?p.DATA:{};render()})});document.getElementById('search').oninput=function(e){query=e.target.value.toLowerCase();page=0;render()};document.getElementById('prev').onclick=function(){page=Math.max(0,page-1);render()};document.getElementById('next').onclick=function(){page++;render()};
</script></body></html>
